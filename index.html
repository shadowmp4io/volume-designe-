<style>
:root{color-scheme:dark;--fg:#f5f5f7;--mut:rgba(245,245,247,.6);--glass:rgba(48,48,54,.5);--card:rgba(28,28,32,.46);--edge:rgba(255,255,255,.32);--edge2:rgba(255,255,255,.07);--trk:rgba(0,0,0,.4);--fill:#dcdcde;--fsh:rgba(0,0,0,.3);--acc:#2f80ff;--k:0;--R:14px;

*{box-sizing:border-box}

#bgs{position:fixed;inset:0;z-index:-1;background:#000;overflow:hidden}
#bgs::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.bgl{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;will-change:transform,filter,opacity}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* verre liquide */
.gl,.g2{position:relative;background:var(--glass);background:color-mix(in srgb,var(--glass) calc((1 - var(--k))*100%),var(--trk));box-shadow:inset 0 1.5px 0 var(--edge),inset 0 -1px 0 var(--edge2),inset 0 0 0 1px var(--edge2),0 20px 40px -14px rgba(0,0,0,calc(.6*(1 - var(--k))))}
.gl{-webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.06);backdrop-filter:blur(30px) saturate(190%) brightness(1.06)}
.gl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sh,0);background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.55) 50%,transparent 68%) var(--sp,50%) 0/260% 100% no-repeat}
.gl::before,.g2::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.2),transparent 36%,transparent 64%,rgba(255,255,255,.07))}
/* panneau */
#stage{position:fixed;right:calc(var(--R) + env(safe-area-inset-right,0px));top:50%;width:0;height:0;z-index:20;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pw{position:absolute;visibility:hidden;touch-action:none;transform-origin:100% 50%;will-change:transform}
.pw>.sl,.pw>.pb,.pw>.tp{width:100%;height:100%;border-radius:inherit}

.fl{position:absolute;inset:0;background:var(--fill);border-radius:11px 11px 0 0;box-shadow:0 -3px 14px var(--fsh);will-change:transform}

@property --tint{syntax:"<color>";inherits:false;initial-value:rgba(0,0,0,0)}
.pb{--tint:rgba(0,0,0,0);border:0;display:grid;place-items:center;color:var(--fg);cursor:pointer;padding:0;background:linear-gradient(var(--tint),var(--tint)),color-mix(in srgb,var(--glass) calc((1 - var(--k))*100%),var(--trk));transition:--tint .45s ease}
.pb[data-t=bell].on{--tint:rgba(255,159,10,.3)}.pb[data-t=moon].on{--tint:rgba(157,140,255,.3)}
.pb svg{width:23px;height:23px}
[data-t=bell].on{color:#ff9f0a}[data-t=moon].on{color:#9d8cff}.pb.on svg{filter:drop-shadow(0 0 7px currentColor)}
.tp{position:relative;overflow:hidden;touch-action:none;cursor:grab}
.tf{position:absolute;inset:0;background:var(--fill);opacity:.28;transform-origin:0 50%;transform:scaleX(0)}

.mini,#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:22px;border-radius:11px;border:0;padding:0;z-index:30;display:grid;place-items:center;color:var(--fg);opacity:0;cursor:pointer;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent;animation:in 1.2s .5s cubic-bezier(.2,.9,.25,1) forwards;transition:opacity .4s,width .7s cubic-bezier(.34,1.6,.5,1),transform .55s cubic-bezier(.34,1.7,.5,1)}
@keyframes in{to{opacity:.32}}
.mini:hover,.mini:focus-visible,#dock:hover,#dock:focus-visible,#dock[aria-expanded=true]{opacity:.95;animation:none}
#dock{left:50%;width:46px;transform:translateX(-50%)}
#dock:hover,#dock:focus-visible,#dock[aria-expanded=true]{width:64px}
#dock:active{transform:translateX(-50%) scale(.86)}
#bgb{left:calc(14px + env(safe-area-inset-left,0px));width:34px}
#bgx{left:calc(56px + env(safe-area-inset-left,0px));width:22px;transform:scale(0);pointer-events:none}

.mini:active{transform:scale(.86)}#bgx.on:active{transform:scale(.86)}
.mini svg,#dock svg{width:15px;height:13px}

body.co .mini,body.co #dock{opacity:0!important;pointer-events:none}
#ccb{position:fixed;inset:0;z-index:35;visibility:hidden;opacity:0;touch-action:none;background:rgba(8,8,10,.6);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}
#cc{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:center;visibility:hidden;pointer-events:none;will-change:transform}
#ccc{width:min(calc(100vw - 32px),420px);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;transform-origin:50% 0;pointer-events:auto;--tl:rgba(54,54,58,.92)}
.cr{display:flex;gap:10px;margin-bottom:10px;transform-origin:50% 0;will-change:transform,opacity}
.cr.top{height:38px;align-items:center;justify-content:space-between;padding:0 10px;font-size:17px;font-weight:500;margin-bottom:6px}
.si{display:flex;gap:7px;align-items:center}.si svg{display:block}.g5{font-size:10px;font-weight:700;margin-right:-3px;align-self:flex-start;margin-top:3px}
.bt{position:relative;isolation:isolate;border:0;padding:0;color:var(--fg);background:var(--tl);--cut:#36363a;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.045),0 10px 20px -10px rgba(0,0,0,.6);transition:transform .6s cubic-bezier(.3,1.6,.5,1),color .3s,background-color .3s}
.bt::before{content:"";position:absolute;inset:0;z-index:-1;background:#e0e0e2;clip-path:circle(0% at var(--ox,50%) var(--oy,50%));transition:clip-path .65s cubic-bezier(.3,.85,.3,1)}
.bt.on::before{clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}
.bt.on{color:#2f80ff;--cut:#e0e0e2}
.bt:active{transform:scale(.9);transition-duration:.14s,.3s,.3s;transition-timing-function:cubic-bezier(.2,.8,.3,1),ease,ease}
.tile{flex:1;height:72px;border-radius:36px;display:flex;align-items:center;gap:12px;padding:0 18px;text-align:left;font:inherit;min-width:0}
.tile.on{color:#1b1b1e}.tile.on .ti{color:#2f80ff}
.ti svg{width:30px;height:30px;display:block}
.tt b{display:block;font-size:16px;font-weight:600;white-space:nowrap}.tt small{display:block;font-size:13px;opacity:.6;margin-top:1px}
.r3{height:162px}
.media{flex:2.2;position:relative;border-radius:34px;background:var(--tl);padding:14px 10px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.04),0 10px 20px -10px rgba(0,0,0,.6)}

.mt{display:flex;align-items:center;gap:8px;margin-top:40px;font-size:16px;color:var(--mut)}
.eq{display:none;gap:3px;height:16px;align-items:flex-end}.pl .eq{display:flex}
.eq i{width:3px;height:4px;background:#2f80ff;border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.25s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:16px}}
.ctl{display:flex;justify-content:space-between;align-items:center}
.mc{border:0;background:none;color:rgba(255,255,255,.4);width:46px;height:46px;display:grid;place-items:center;cursor:pointer;transition:transform .55s cubic-bezier(.3,1.6,.5,1);-webkit-tap-highlight-color:transparent}
.mc:active{transform:scale(.8);transition-duration:.12s}.mc svg{width:26px;height:26px}#pl{color:#fff}#pl svg{width:30px;height:30px}
.scc{flex:1;border-radius:34px;background:rgba(46,46,50,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.04),0 10px 20px -10px rgba(0,0,0,.6)}
.scc[data-k=bright] .ic{color:#ff9f0a}
.hub{height:70px;border-radius:35px;justify-content:space-between;padding:0 14px 0 22px}.hub>b{font-size:18px;font-weight:500}
.chips{display:flex;align-items:center;gap:8px}
.chip.bt{--tl:rgba(255,255,255,.1);box-shadow:none;border-radius:50%;display:grid;place-items:center;width:40px;height:40px}
.chip:nth-child(2){width:34px;height:34px}.chip:nth-child(3){width:30px;height:30px}.chip svg{width:18px;height:18px}
.c{justify-content:space-between}
.c .bt{flex:0 1 72px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}.c .bt svg{width:27px;height:27px}
.cr.foot{flex-direction:column;align-items:center;gap:0;margin:2px 0 0}
#edit{border:0;padding:11px 26px;border-radius:22px;background:var(--tl);color:var(--fg);font:inherit;font-size:16px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .55s cubic-bezier(.3,1.6,.5,1);-webkit-tap-highlight-color:transparent}
#edit:active{transform:scale(.9);transition-duration:.12s}
#ccg{width:140px;height:34px;display:grid;place-items:center;touch-action:none;cursor:grab;margin-top:6px}
#ccg i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);transition:width .5s cubic-bezier(.34,1.7,.5,1),background .3s}
#ccg.drag i,#ccg:hover i{width:54px;background:rgba(255,255,255,.55)}
.ed .c .bt{animation:jig .26s ease-in-out infinite alternate}.ed .c .bt:nth-child(odd){animation-delay:-.13s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-1.8deg) scale(.97)}to{transform:rotate(1.8deg) scale(1)}}
#grab{position:fixed;top:0;left:50%;width:min(220px,60vw);margin-left:calc(min(220px,60vw) / -2);height:calc(34px + env(safe-area-inset-top,0px));z-index:50;border:0;background:none;padding:0;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
#grab i{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 9px);width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(255,255,255,.34);box-shadow:inset 0 .5px 0 rgba(255,255,255,.4);transition:width .5s cubic-bezier(.34,1.7,.5,1),margin .5s cubic-bezier(.34,1.7,.5,1),background .3s;animation:nud 1.1s 1.6s cubic-bezier(.3,1.4,.5,1) 1}
#grab:hover i,#grab.drag i{width:54px;margin-left:-27px;background:rgba(255,255,255,.62)}
@keyframes nud{40%{transform:translateY(8px)}}
#dimall{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.mini,#dock{animation-duration:.01s}#grab i,.ed .c .bt,.eq i{animation:none}}
</style>

<body>
<div id="bgs"></div>
<div id="stage"></div>
<input type="file" id="fi" accept="image/*" hidden>
<button class="mini" id="bgb" aria-label="Changer le fond"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><circle cx="5.5" cy="6.4" r="1.1" fill="currentColor" stroke="none"/><path d="M2 12l4-3.4 3 2.4 2.4-2 3 3"/></svg></button>
<button class="mini" id="bgx" aria-label="Retirer l’image"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 4.5l7 7m0-7l-7 7"/></svg></button>
<button id="dock" aria-label="Volume" aria-expanded="false"><svg viewBox="0 0 16 12" fill="currentColor"><rect x="1" y="4" width="3" height="4" rx="1.5"/><rect x="6.5" y="1" width="3" height="10" rx="1.5"/><rect x="12" y="3" width="3" height="6" rx="1.5"/></svg></button>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

/* haptique : vibration (Android) ou micro-tick du commutateur natif (iOS 17.4+) */
const hx=document.createElement("label");hx.setAttribute("aria-hidden","true");
hx.style.cssText="position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden";
hx.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hx);
let hl=0;
const hap=(p=6,gap=30)=>{const n=performance.now();if(n-hl<gap)return;hl=n;try{if(navigator.vibrate)navigator.vibrate(p);else hx.click()}catch(_){}};
/* icônes */
const S1='<svg viewBox="0 0 24 24" fill="currentColor">';
const VOL=l=>S1+'<path d="M3 9.5v5h3.6l4.9 4.5V5L6.6 9.5z"/>'+(l?'<g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M15 9.2a4 4 0 010 5.6"/>'+(l>1?'<path d="M17.9 6.5a8 8 0 010 11"/>':'')+'</g>':'<path d="M15 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/>')+'</svg>';
const BE=S1+'<path d="M12 3a6 6 0 00-6 6v3.6l-1.7 3.6c-.3.6.1 1.3.8 1.3h13.8c.7 0 1.1-.7.8-1.3L18 12.6V9a6 6 0 00-6-6zM9.8 19.4a2.2 2.2 0 004.4 0z"/></svg>';
const BO=S1+'<path d="M12 3a6 6 0 00-6 6v3.6l-1.7 3.6c-.3.6.1 1.3.8 1.3h13.8c.7 0 1.1-.7.8-1.3L18 12.6V9a6 6 0 00-6-6zM9.8 19.4a2.2 2.2 0 004.4 0z"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const AL='<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.6" fill="currentColor"/><path d="M12 9.2v4.1l2.6 1.6" fill="none" stroke="var(--fill)" stroke-width="1.9" stroke-linecap="round"/><path d="M4.6 6.2l2.8-2.6m12 2.6l-2.8-2.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const MO=S1+'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
const DT='<svg width="22" height="8" viewBox="0 0 24 8" fill="currentColor"><circle cx="4" cy="4" r="2.3"/><circle cx="12" cy="4" r="2.3"/><circle cx="20" cy="4" r="2.3"/></svg>';
/* état */
const S={media:.57,ring:.68,alarm:.93,bright:.85};
const T={bell:{on:0,min:0,end:0},moon:{on:0,min:0,end:0}};
const LB={media:"Média",ring:"Sonnerie",alarm:"Alarme",bright:"Luminosité"},NM={bell:"Silence",moon:"Concentration"};

const SP=[];let raf=0,last=0;

stage.innerHTML=`<div id="card" class="gl"></div><div class="pw" id="p3">${sl("ring","g2")}</div><div class="pw" id="p4">${sl("alarm","g2")}</div>${tm("p5","bell")}${tm("p6","moon")}<div class="pw" id="p0">${sl("media","gl")}<div class="dots" aria-hidden="true">${DT}</div></div><div class="pw" id="p1"><button class="pb gl" data-t="bell" aria-label="Silence"></button></div><div class="pw" id="p2"><button class="pb gl" data-t="moon" aria-label="Concentration"></button></div>`;
/* centre de contrôle : icônes + DOM */
const sk=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`,fl_=p=>`<svg viewBox="0 0 24 24" fill="currentColor">${p}</svg>`;
const CI={
wifi:sk('<path d="M2.5 9a14 14 0 0119 0M6 12.8a9 9 0 0112 0M9.4 16.5a4 4 0 015.2 0"/><circle cx="12" cy="20" r="1.2" fill="currentColor"/>'),
data:sk('<path d="M8 20V5m0 0L4.5 8.5M8 5l3.5 3.5M16 4v15m0 0l-3.5-3.5M16 19l3.5-3.5"/>'),
bt:sk('<path d="M7 7.5l10 9-5.5 5V2.5l5.5 5-10 9"/>'),
torch:fl_('<path d="M8 2.5h8l-1.5 5.3v2.2h-5V7.8z"/><path d="M9.5 11.2h5V20a1.7 1.7 0 01-1.7 1.7h-1.6A1.7 1.7 0 019.5 20z"/>'),
cam:fl_('<rect x="2" y="6" width="13.5" height="12" rx="3.2"/><path d="M17 10.6l5-3.1v9l-5-3.1z"/>'),
rec:sk('<path d="M12 2.8l7.8 4.4v9.6L12 21.2l-7.8-4.4V7.2z"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/>'),
send:sk('<path d="M3.5 11.5l17-8-6.5 17-2.6-7.4z"/>'),
rot:sk('<path d="M20 12a8 8 0 01-13.5 5.8M4 12a8 8 0 0113.5-5.8M17.8 2.8v3.8h-3.8M6.2 21.2v-3.8h3.8"/><rect x="9.3" y="11.4" width="5.4" height="4.4" rx="1.1" fill="currentColor" stroke="none"/><path d="M10.5 11.4v-1a1.5 1.5 0 013 0v1" stroke-width="1.6"/>'),
tr:'<svg viewBox="0 0 24 24"><text x="12" y="16.8" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="system-ui,sans-serif">文A</text></svg>',
boost:fl_('<path d="M12 2.5c3.6 2 5.2 5.6 4.6 10l-2 2.5H9.4l-2-2.5C6.8 8.1 8.4 4.5 12 2.5z"/><path d="M7.4 13.2L5 17l3.4-.7zM16.6 13.2L19 17l-3.4-.7zM10 17h4l-2 4.5z"/>'),
