<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volume</title>
<style>

*{box-sizing:border-box}
html{height:100%;background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}

.tp{position:relative;overflow:hidden;touch-action:none;cursor:grab}

#dock{left:50%;width:46px;transform:translateX(-50%)}

</style>
</head>

<script>

 [[3,E2],[4,E3]].forEach(([n,s])=>{if(hid(n,s,s.x))return;const f=F(n);f.style.opacity=cl(s.x*2.2);f.style.filter=mb(Math.abs(s.v)*.4)});

/* fond personnalisé */
